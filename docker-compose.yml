services:
  app:
    build:
      context: .
      args:
        # 国内服务器在 .env 里设 PIP_INDEX_URL=https://pypi.tuna.tsinghua.edu.cn/simple
        # 可显著提速并避免下载中断导致构建失败
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    ports:
      - "8000:8000"
    # 密钥从 .env 注入，不打进镜像层
    env_file:
      - .env
    environment:
      # 覆盖本地默认的 SQLite，指向本 compose 内的 mysql 服务
      DATABASE_URL: mysql+pymysql://jobpilot:${MYSQL_PASSWORD}@mysql:3306/jobpilot?charset=utf8mb4
      # 会话锁与每日配额走 Redis。只等它就绪不做健康门禁：
      # 连不上会自动降级（不锁不限流），不该因为缓存故障卡住整个服务启动
      REDIS_URL: redis://redis:6379/0
    volumes:
      # checkpoint（SqliteSaver）与 Chroma 向量库都要持久化，
      # 否则每次重建容器，会话记忆和知识库索引全部丢失
      - ./data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: jobpilot
      MYSQL_USER: jobpilot
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # 用 $$ 转义，让密码在容器内展开而不是被 compose 提前插值
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # 只存会话锁和当天计数：关掉持久化，重启后锁自动清空、配额重新计
    # （真丢了也不影响，业务数据不在这里）
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  mysql_data:
